name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Compiler l'APK
        shell: bash
        run: |
          if [ -f buildozer.spec ]; then D=.; else D="$(dirname "$(find . -name buildozer.spec | head -1)")"; fi
          cd "$D"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Afficher les vraies erreurs (si echec)
        if: failure()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          echo "===== LIGNES D'ERREUR ====="
          grep -n -i -E "error|failed|not found|traceback|exception" clean.log | grep -v -E "^[0-9]+:#" | tail -n 40 | cut -c1-300
          echo "===== 40 LIGNES AVANT LE MESSAGE FINAL ====="
          grep -n "Command failed" clean.log | head -1 | cut -c1-400
          L=$(grep -n "Command failed" clean.log | head -1 | cut -d: -f1)
          if [ -n "$L" ]; then sed -n "$((L-40)),$((L))p" clean.log | cut -c1-300; fi

      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonVIEW-apk
          path: "**/bin/*.apk"
          if-no-files-found: error

      - name: Envoyer le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
