name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Compiler l'APK
        shell: bash
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK
          java -version
          if [ -f buildozer.spec ]; then D=.; else D="$(dirname "$(find . -name buildozer.spec | head -1)")"; fi
          cd "$D"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Afficher les vraies erreurs (si echec)
        if: failure()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          echo "===== CAUSE GRADLE ====="
          grep -n -A 30 "What went wrong" clean.log | cut -c1-300 | head -n 80
          echo "===== AUTRES ERREURS ====="
          grep -n -i -E "error:|FAILED|not found|Traceback|Caused by" clean.log | grep -v -E "^[0-9]+:#" | tail -n 30 | cut -c1-300

      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonVIEW-apk
          path: "**/bin/*.apk"
          if-no-files-found: error

      - name: Envoyer le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
