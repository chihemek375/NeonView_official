name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Compiler l'APK
        run: |
          cd "$(dirname "$(find . -name buildozer.spec | head -1)")"
          buildozer -v android debug

      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonVIEW-apk
          path: "**/bin/*.apk"
